<h1>Regisztráció</h1>

<form [formGroup]="workForm" (ngSubmit)="register()">
    <div class="mt-2">
        <label class="form-label" for="projectName">
            Projekt neve <sup class="text-danger">*</sup>
            @if(workForm.get('projectName')?.hasError('required') &&
                workForm.get('projectName')?.touched) {
                <small class="text-danger">Kötelező megadni!</small>
            }
            <small class="text-danger">
                @if(workForm.get('projectName')?.touched) {
                    @if(workForm.get('projectName')?.hasError('minlength')) {
                        Minimum 3 karakter kell!
                    } @else if(workForm.get('projectName')?.hasError('pattern')) {
                        Minimum 3 nem whitespace karakter kell!
                    }
                }
            </small>
        </label>
        <input class="form-control" type="text" id="projectName" formControlName="projectName" minlength="3" autocomplete="off">
    </div>
    <div class="mt-2">
        <label class="form-label" for="date">
            Dátum <sup class="text-danger">*</sup>
            @if(workForm.get('date')?.hasError('required') &&
                workForm.get('date')?.touched) {
                <small class="text-danger">Kötelező megadni!</small>
            }
            @if(workForm.get('date')?.hasError('futureDate') &&
                workForm.get('date')?.touched) {
                <small class="text-danger">Nem lehet jövőbeli dátum!</small>
            }
        </label>
        <input class="form-control" type="date" id="date" formControlName="date" [max]="todayDate" autocomplete="off">
    </div>
    <div class="mt-2">
        <label class="form-label" for="workedHours">
            Ledolgozott órák <sup class="text-danger">*</sup>
            @if(workForm.get('workedHours')?.hasError('required') &&
                workForm.get('workedHours')?.touched) {
                <small class="text-danger">Kötelező megadni!</small>
            }
            @if((workForm.get('workedHours')?.hasError('min') ||
                workForm.get('workedHours')?.hasError('max')) &&
                workForm.get('workedHours')?.touched) {
                <small class="text-danger">Minimum 0,5 óra és maximum 12 óra lehet!</small>
            }
        </label>
        <input class="form-control" type="number" id="workedHours" formControlName="workedHours" min="0.5" max="12" step="0.5" autocomplete="off">
    </div>
    <div class="mt-2">
        <label class="form-label" for="description">
            Leírás <sup class="text-danger">*</sup>
            @if(workForm.get('description')?.hasError('required') &&
                workForm.get('description')?.touched) {
                <small class="text-danger">Kötelező megadni!</small>
            }
            @if(workForm.get('description')?.hasError('maxlength') &&
                workForm.get('description')?.touched) {
                <small class="text-danger">Maximum 30 karakter lehet!</small>
            }
        </label>
        <input class="form-control" type="text" id="description" formControlName="description" maxlength="{{descriptionMaxLength}}" autocomplete="off">
        <small>
            {{(workForm.get('description')?.value?.length || 0)}} / {{descriptionMaxLength}} karakterek
        </small>
    </div>
    <button class="btn btn-success mt-3 mb-3" type="submit" [disabled]="workForm.invalid">Regisztráció</button>
</form>
